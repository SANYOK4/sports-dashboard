<app-header></app-header>

<div class="main-container">
  
  <app-sidebar (selectLeague)="filterMatches($event)"></app-sidebar>

  <main class="content">
    <div class="search-box">
  <input 
    type="text" 
    placeholder="🔍 Пошук команди..." 
    (input)="onSearch($event)"
  >
  </div>
    <div class="league-header">
      <h2>{{ currentTitle }}</h2>
      <span class="subtitle">Оновлено щойно</span>
    </div>

    <div class="matches-list">
      <div class="matches-list">
      <app-match-card 
        *ngFor="let item of matches"
        [match]="item">
      </app-match-card>
      </div>
    </div>
  </main>

</div>
